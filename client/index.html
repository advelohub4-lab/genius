<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0e1b33" />
    <meta name="description" content="Skill2Earn HUB helps people train AI through data tasks, annotation, model evaluation, and prompt testing, then discover transparent paid work opportunities." />
    <link rel="preload" as="image" href="/manus-storage/skill2earn-card-ai-training_41471d00.png" fetchpriority="high" />
    <title>Skill2Earn HUB — Train AI. Earn money. Work online.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Analytics (Umami) loaded only when both env vars are configured.
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (analyticsEndpoint && analyticsWebsiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${analyticsEndpoint}/umami`;
        s.setAttribute("data-website-id", analyticsWebsiteId);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
