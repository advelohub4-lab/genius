services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw_dev
      MYSQL_DATABASE: skill2earn
      MYSQL_USER: skill2earn
      MYSQL_PASSWORD: skill2earn_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "skill2earn", "-pskill2earn_dev"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm
    environment:
      - DATABASE_URL=mysql://skill2earn:skill2earn_dev@db:3306/skill2earn
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec drizzle-kit migrate"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://skill2earn:skill2earn_dev@db:3306/skill2earn
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
  node_modules:
  pnpm_store:
